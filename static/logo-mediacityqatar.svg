<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" role="img" aria-label="Media City Qatar">
  <!-- Hexagon geometric pattern -->
  <g transform="translate(10,8)">
    <!-- Outer triangles - dark navy/purple -->
    <polygon points="32,0 42,17 22,17" fill="#1a1464"/>
    <polygon points="52,0 62,17 42,17" fill="#1a1464"/>
    <polygon points="12,17 22,0 32,17" fill="#00b4d0"/>
    <polygon points="62,17 72,0 82,17" fill="#1a1464"/>
    <!-- Middle row -->
    <polygon points="12,17 22,34 2,34" fill="#1a1464"/>
    <polygon points="32,17 42,34 22,34" fill="#00b4d0"/>
    <polygon points="52,17 62,34 42,34" fill="#1a1464"/>
    <polygon points="72,17 82,34 62,34" fill="#00b4d0"/>
    <!-- Bottom row -->
    <polygon points="22,34 32,51 12,51" fill="#00b4d0"/>
    <polygon points="42,34 52,51 32,51" fill="#1a1464"/>
    <polygon points="62,34 72,51 52,51" fill="#00b4d0"/>
    <polygon points="32,51 42,68 22,68" fill="#1a1464"/>
    <polygon points="52,51 62,68 42,68" fill="#1a1464"/>
  </g>
  <!-- Text -->
  <text x="110" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1464" direction="rtl" text-anchor="start">المدينة الإعلامية</text>
  <text x="110" y="42" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1464">Media City</text>
  <text x="110" y="60" font-family="Arial, sans-serif" font-size="14" fill="#00b4d0">Qatar  <tspan font-family="Arial" direction="rtl">قطر</tspan></text>
</svg>
